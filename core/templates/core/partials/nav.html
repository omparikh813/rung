{% load rung %}
{% for item in nav_items %}
<a href="{{ item.url }}" class="nav-item" {% if item.active %}aria-current="page"{% endif %}>
  {% icon item.icon "size-5" %}
  <span class="flex-1">{{ item.label }}</span>
  {% if item.count %}<span class="inline-flex min-w-6 items-center justify-center rounded-full px-1.5 py-0.5 text-xs font-bold {% if item.active %}bg-forest text-white{% else %}bg-lime text-forest{% endif %}" aria-label="{{ item.count }} open">{{ item.count }}</span>{% endif %}
</a>
{% endfor %}
