{# field: a bound form field. hint: optional AI issue text shown under a flagged field. #}
<div class="field {{ wrap|default:'' }}">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-muted">{{ field.help_text }}</p>{% endif %}
  <div id="hint-{{ field.name }}">{% include "core/partials/field_hint.html" with errors=field.errors %}</div>
</div>
