{% load rung %}
{# errors: form errors for the field. hint: the AI issue text for a flagged field. #}
{% for error in errors %}<p class="field-error" role="alert">{% icon "circle-x" "mt-0.5 size-4" %}<span>{{ error }}</span></p>{% endfor %}
{% if hint %}<p class="field-hint">{% icon "triangle-alert" "mt-0.5 size-4" %}<span>{{ hint }}</span></p>{% endif %}
