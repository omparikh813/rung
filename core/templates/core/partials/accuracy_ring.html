{# percent: 0 to 100 or None. size: Tailwind size class. tone: stroke color class. #}
<div class="relative {{ size|default:'size-16' }} shrink-0" role="img" aria-label="{% if percent is None %}No accuracy yet{% else %}Accuracy {{ percent }} percent{% endif %}">
  <svg viewBox="0 0 36 36" class="size-full -rotate-90">
    <circle cx="18" cy="18" r="15.5" fill="none" stroke-width="4" class="stroke-primary-soft"></circle>
    {% if percent %}
    <circle cx="18" cy="18" r="15.5" fill="none" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100"
            class="ring-progress {{ tone|default:'stroke-primary' }}" style="--ring-length: 100; stroke-dashoffset: calc(100 - {{ percent }})"></circle>
    {% endif %}
  </svg>
  <span class="code absolute inset-0 flex items-center justify-center text-xs font-semibold text-forest" aria-hidden="true">
    {% if percent is None %}&ndash;{% else %}{% include "core/partials/count_up.html" with value=percent %}%{% endif %}
  </span>
</div>
